name: Verify Homebrew install
on: [push, pull_request]
permissions:
  contents: read
jobs:
  install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register checked-out formula
        run: |
          brew tap --custom-remote cchiddy480/forge "$GITHUB_WORKSPACE"
          brew trust --formula cchiddy480/forge/forge-bootstrap
      - run: brew install cchiddy480/forge/forge-bootstrap --build-from-source --no-ask
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
      - run: brew test cchiddy480/forge/forge-bootstrap
      - run: forge doctor --preset python
